<h1 class="text-center">Fale conosco.</h1>
<section>
    <div class="grid-container">
    <p></p>
    <p></p>
</div>


    <div class="d-flex justify-content-center align-items-center vh-100">
        <form action="envio.php" method="POST" class="p-4" style="max-width: 500px; width: 100%;">
            <h2>Entre em Contato</h2>
    
            <div class="mb-3">
                <label class="form-label">Seu nome completo é?</label>
                <input type="text" class="form-control" name="nome" placeholder="Seu nome" required>
            </div>
    
            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required>
            </div> 
    
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000" required>
            </div>
    
            <div class="mb-3">
                <label for="mensagem" class="form-label">Fale conosco:</label>
                <textarea id="mensagem" name="mensagem" class="form-control" rows="4"></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Enviar</button>
        </form>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
